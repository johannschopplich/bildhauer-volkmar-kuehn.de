title:
  de: Übersicht
  en: Site

tabs:
  dashboard:
    label:
      de: Übersicht
      en: Dashboard
    icon: dashboard
    columns:
      - width: 1/2
        sections:
          listedPages:
            type: pages
            headline:
              de: Gelistete Seiten
              en: Listed Pages
            status: listed
            create: default
            info: "/{{ page.slug }}"
            image:
              back: "#625240"
              cover: true

      - width: 1/2
        sections:
          unlistedPages:
            type: pages
            headline:
              de: Ungelistete Seiten
              en: Unlisted Pages
            status: unlisted
            create: default
            info: "/{{ page.slug }}"
            image:
              back: "#625240"
              cover: true
          pageDrafts:
            type: pages
            headline:
              de: Entwürfe
              en: Drafts
            status: draft
            create: default
            info: "/{{ page.slug }}"
            image:
              back: white
              cover: true
          footer:
            type: fields
            fields:
              footerPages:
                label:
                  de: Fußzeilenlinks
                  en: Footer Pages
                type: pages

  seo:
    label: SEO
    icon: search
    columns:
      - width: 2/3
        sections:
          meta:
            type: fields
            fields:
              description:
                extends: fields/description
                help:
                  de: Für Seiten ohne eigene Beschreibung.
                  en: For pages without a description of their own.

      - width: 1/3
        sections:
          preview:
            type: fields
            fields:
              thumbnail:
                extends: fields/thumbnail
                query: kirby.site.files.template("image")
                uploads:
                  parent: kirby.site
                  template: image
                help:
                  de: Für Seiten ohne eigenes Vorschaubild.
                  en: For pages without a thumbnail of their own.

  images: tabs/images
